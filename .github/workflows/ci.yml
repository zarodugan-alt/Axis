name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The report step posts failure-log tails as commit comments (the build
# agent's network cannot reach the Actions log service, but the GitHub API
# works). No other step writes to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # No Gradle wrapper jar is checked in yet (see README), so provision
      # the distribution directly with the official setup-gradle action.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Assemble debug
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log

      - name: NewApi lint (minSdk 28 gate)
        run: |
          set -o pipefail
          gradle lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axis-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Report failure logs to commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI failure on \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::8}"
            echo ""
            for f in assemble.log test.log lint.log; do
              if [ -f "$f" ]; then
                echo "<details><summary><code>$f</code> (tail)</summary>"
                echo ""
                echo '```'
                tail -c 15000 "$f"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body=@comment.md
