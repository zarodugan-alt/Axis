name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # No Gradle wrapper jar is checked in yet (see README), so provision
      # the distribution directly with the official setup-gradle action.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Assemble debug
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --console=plain

      - name: NewApi lint (minSdk 28 gate)
        run: gradle lintDebug --stacktrace --console=plain

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
