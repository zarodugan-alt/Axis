# AXIS dependency catalog — P1 set.
# P2+ additions (Room, SQLCipher, OkHttp/SSE, WorkManager, Security-Crypto, Coil,
# Lottie, Vico, Balloon, sherpa-onnx, tess-two, OpenCV, NanoHTTPD, ACRA,
# AboutLibraries, …) get appended here as their phases land.
[versions]
agp = "8.3.2"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"
hilt = "2.51.1"
composeBom = "2024.02.02"
composeCompiler = "1.5.10"
activityCompose = "1.9.0"
navigationCompose = "2.7.7"
lifecycleRuntimeCompose = "2.7.0"
hiltNavigationCompose = "1.2.0"
coreKtx = "1.12.0"
coroutines = "1.8.1"
datastore = "1.0.0"
timber = "5.0.1"
junit = "4.13.2"
compileSdk = "34"
minSdk = "28"
targetSdk = "28"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
